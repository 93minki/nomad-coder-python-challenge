<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Scraper</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main.container {
        max-width: 720px;
        text-align: center;
      }

      form {
        margin: 2rem auto 1rem;
        max-width: 520px;
      }

      .keywords {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>Job Scraper</h1>
      <p>Python, JavaScript, Java 채용공고를 한 번에 확인하세요.</p>

      <form action="/search/">
        <input
          type="text"
          name="keyword"
          placeholder="검색어를 입력하세요"
          required
        />
        <button type="submit">검색</button>
      </form>

      <script>
        const form = document.querySelector("#search-form");
        const keywords = new Set(["python", "javascript", "java"]);
      
        form.addEventListener("submit", (event) => {
          event.preventDefault();
      
          const keyword = new FormData(form)
            .get("keyword")
            .trim()
            .toLowerCase();
      
          if (keywords.has(keyword)) {
            window.location.href = `search/${keyword}/`;
          } else {
            window.location.href = "not-found/";
          }
        });
      </script>
    </main>
  </body>
</html>
